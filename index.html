<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume & Portfolio Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>AI Resume & Portfolio Builder</h1>
        <p class="tagline">Build Professional Resumes Instantly with AI</p>

        <form id="resumeForm">
            <input type="text" id="name" placeholder="Full Name" required>

            <textarea id="education" placeholder="Education Details"></textarea>

            <textarea id="skills" placeholder="Skills (comma separated)"></textarea>

            <textarea id="projects" placeholder="Projects"></textarea>

            <button type="submit">Generate Resume</button>
        </form>

        <div id="output" class="hidden">
            <h2>Generated Resume</h2>
            <div id="resumeContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
