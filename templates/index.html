<!DOCTYPE html>
<html>
<head>
    <title>ML Resume Builder</title>
</head>
<body>
    <h2>Machine Learning Based Resume Builder</h2>

    <form action="/generate" method="POST">
        <input type="text" name="name" placeholder="Full Name" required><br><br>
        <textarea name="education" placeholder="Education Details"></textarea><br><br>
        <textarea name="skills" placeholder="Skills"></textarea><br><br>
        <textarea name="projects" placeholder="Projects"></textarea><br><br>
        <button type="submit">Generate Resume</button>
    </form>
</body>
</html>
